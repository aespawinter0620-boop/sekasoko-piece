name: Verify prototype

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Verify generated HTML matches source
        run: npm run check
      - name: Verify battle rules
        run: npm run test:engine
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify browser controls and responsive layouts
        run: npm run test:ui

<body>
<div class="scene-background" aria-hidden="true"></div>
<div class="app">

<main class="battle-layout">
 <section class="command-region" id="commandRegion">
 <header class="topbar" id="hud">
 <div class="topline"><span class="version">VER.004</span><div class="utility-actions"><button class="utility-btn" id="waitBtn">待機</button><button class="utility-btn" id="logBtn" aria-expanded="false" aria-controls="logPanel">ログ</button><button class="utility-btn" id="menuBtn" aria-expanded="false" aria-controls="menuPanel">メニュー</button></div></div>
 <div class="journey"><div class="floor-line"><div class="floor-badge"><span id="floorNum">1</span><small> F</small></div><div class="floor-name"><b id="floorTitle">はじまりの回廊</b></div></div><div class="phase"><span class="turn" id="turnNum">TURN 01</span><span class="phase-pill" id="phaseBadge" aria-live="polite">あなたの手番</span></div></div>
</header>
 <aside class="panel inspector" id="inspector"><div class="panel-head"><span>PIECE STATUS</span><span id="selectedMark">未選択</span></div><div class="inspector-body" id="inspectorBody"></div><div class="skill-actions inactive" id="skillActions"><button class="skill-btn" id="normalAttackBtn" aria-pressed="false">通常攻撃<small>射程内の敵を選択</small></button><button class="skill-btn" id="uniqueSkillBtn" disabled>固有技<small>未実装</small></button><button class="skill-btn" id="ultimateSkillBtn" disabled>必殺技<small>未実装</small></button></div><div class="action-footer"><div class="action-note" id="boardHint" aria-live="polite"></div><button class="cancel-attack" id="cancelAttackBtn" hidden>攻撃をやめる</button></div></aside>
 </section>
 <section class="arena" aria-label="戦闘盤面"><div class="board-slot"><div class="board-wrap"><i class="corner nw" aria-hidden="true"></i><i class="corner ne" aria-hidden="true"></i><i class="corner sw" aria-hidden="true"></i><i class="corner se" aria-hidden="true"></i><div class="board board-surface" id="board"><div class="board-skin" aria-hidden="true"></div><div class="cells" id="cells"></div><div class="piece-layer" id="pieceLayer"></div></div></div></div></section>
</main>
</div>
<div class="flyout" id="menuPanel" hidden role="group" aria-label="メニュー"><div class="panel-head"><span>MENU</span><button class="close-flyout" id="closeMenuBtn" aria-label="メニューを閉じる">×</button></div><div class="menu-options"><button id="helpBtn">遊び方・手駒一覧</button><button id="restartBtn">最初からやり直す</button></div></div>
<section class="flyout" id="logPanel" hidden aria-label="戦闘ログ"><div class="panel-head"><span>BATTLE LOG</span><button class="close-flyout" id="closeLogBtn" aria-label="ログを閉じる">×</button></div><ol class="log-list" id="logList" aria-live="polite"></ol></section>
<div id="toast" class="toast" role="status"></div>
<div id="overlay" class="overlay" hidden><section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1"></section></div>
<noscript>このゲームを遊ぶにはJavaScriptを有効にしてね。</noscript>

<noscript>このゲームを遊ぶにはJavaScriptを有効にしてね。</noscript>
<script>
/* セカソコ！ 手駒編 VER.001 — common character master (all prototype values). */
const MASTER = Object.freeze({
  king: Object.freeze({ name: '王', icon: '♚︎', hp: 12, atk: 2, move: 1, range: 1, cost: 0 }),
  knight: Object.freeze({ name: '騎士', icon: '♞︎', hp: 8, atk: 3, move: 2, range: 1, cost: 3 }),
  archer: Object.freeze({ name: '弓兵', icon: '🏹', hp: 5, atk: 2, move: 1, range: 3, cost: 2 }),
  mage: Object.freeze({ name: '魔法使い', icon: '🔮', hp: 4, atk: 4, move: 1, range: 3, cost: 4 }),
  slime: Object.freeze({ name: 'スライム', icon: '💧', hp: 4, atk: 1, move: 1, range: 1, cost: 1 }),
  goblin: Object.freeze({ name: 'ゴブリン', icon: '👺', hp: 5, atk: 2, move: 2, range: 1, cost: 2 }),
  orc: Object.freeze({ name: 'オーク', icon: '🪓', hp: 9, atk: 3, move: 1, range: 1, cost: 3 }),
  golem: Object.freeze({ name: 'ゴーレム', icon: '🗿', hp: 14, atk: 2, move: 1, range: 1, cost: 4 }),
  hamster: Object.freeze({ name: 'ハムスター', icon: '🐹', hp: 3, atk: 2, move: 3, range: 1, cost: 1 }),
  dragon: Object.freeze({ name: 'ドラゴン', icon: '🐉', hp: 12, atk: 5, move: 2, range: 2, cost: 6 })
});

/* VER.005 army scale. Character values and battle algorithms stay independent. */
const ARMY_RULES = Object.freeze({
  maxHandPieces: 11,
  costLimit: 35,
  startingTypes: Object.freeze(['knight', 'archer']),
  firstFloorEnemyTypes: Object.freeze([
    'slime', 'slime', 'slime', 'slime', 'slime', 'slime', 'slime',
    'goblin', 'goblin', 'goblin', 'goblin'
  ]),
  playerSlots: Object.freeze([
    [2,0], [2,1], [2,2], [2,3], [2,4], [1,1], [1,3],
    [0,0], [0,1], [0,3], [0,4]
  ].map(([x,y]) => Object.freeze({x,y}))),
  enemySlots: Object.freeze([
    [4,0], [4,1], [4,2], [4,3], [4,4], [5,1], [5,3],
    [6,0], [6,1], [6,3], [6,4]
  ].map(([x,y]) => Object.freeze({x,y})))
});

/* VER.006 passive definitions and character loadouts share one extensible registry. */
const PASSIVES = Object.freeze({
  supportFire: Object.freeze({
    id: 'supportFire', name: '支援射撃', trigger: 'allyNormalAttack', damageMultiplier: 1,
    description: '味方が通常攻撃した敵が射程内にいると、実効ATK100%で1回追撃。自身の攻撃と追撃からは発動しない。'
  }),
  inspiration: Object.freeze({
    id: 'inspiration', name: '鼓舞', trigger: 'adjacentAllyAttack', bonusMultiplier: 0.5,
    description: '上下左右に隣接する味方のATKを基礎値の50%強化。複数の騎士の効果は加算し、最後に端数切り捨て。'
  }),
  stoneWall: Object.freeze({
    id: 'stoneWall', name: '守護の石壁', trigger: 'adjacentAllyHit', damageShare: 1,
    description: '上下左右に隣接する味方へのダメージを全て肩代わり。現在HP最大、同値なら個体ID順。超過ダメージや身代わりは連鎖しない。'
  })
});
const PASSIVE_LOADOUTS = Object.freeze({
  archer: Object.freeze(['supportFire']),
  knight: Object.freeze(['inspiration']),
  golem: Object.freeze(['stoneWall'])
});

/* Individual growth is separate from the unchanged base character master. */
const Growth = (() => {
  const coefficients = Object.freeze({ F:1, E:2, D:3, C:4, B:5, A:7, S:10 });
  const ranks = Object.freeze({ king:'F', slime:'F', hamster:'F', goblin:'E', knight:'D', archer:'D', orc:'D', mage:'C', golem:'B', dragon:'S' });
  const level = piece => Number.isSafeInteger(piece.level) && piece.level > 0 ? piece.level : 1;
  const rank = piece => ranks[typeof piece === 'string' ? piece : piece.type];
  const required = piece => level(piece) * 100 * coefficients[rank(piece)];
  const stats = piece => ({ hp:MASTER[piece.type].hp * level(piece), atk:MASTER[piece.type].atk * level(piece) });
  function ensure(piece) {
    piece.level = level(piece);
    if (!Number.isSafeInteger(piece.exp) || piece.exp < 0) piece.exp = 0;
    return piece;
  }
  function addEXP(piece, amount) {
    ensure(piece);
    const from = piece.level, oldMax = stats(piece).hp, total = piece.exp + amount;
    const cost = 100 * coefficients[rank(piece)], base = 2 * from - 1;
    let count = Math.max(0, Math.floor((Math.sqrt(base * base + 8 * total / cost) - base) / 2));
    const consumed = n => cost * n * (2 * from + n - 1) / 2;
    while (count > 0 && consumed(count) > total) count--;
    while (consumed(count + 1) <= total) count++;
    piece.level += count; piece.exp = total - consumed(count);
    if (Object.hasOwn(piece,'maxHp')) {
      piece.maxHp = stats(piece).hp;
      if (piece.hp > 0) piece.hp += piece.maxHp - oldMax;
    }
    return { from, to:piece.level };
  }
  return Object.freeze({ coefficients, ranks, level, rank, required, stats, ensure, addEXP });
})();

/* Pure battle rules. UI and animation are deliberately outside this module. */
const Engine = (() => {
  const WIDTH = 7, HEIGHT = 5;
  const distance = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
  const inside = (x, y) => Number.isInteger(x) && Number.isInteger(y) && x >= 0 && x < WIDTH && y >= 0 && y < HEIGHT;
  const find = (state, id) => state.units.find(unit => unit.id === id);
  const active = state => state.phase === 'player' || state.phase === 'enemy';
  const append = (state, message) => {
    state.log.unshift(message);
    state.log.length = Math.min(state.log.length, 60);
  };
  const nextID = (state, prefix) => prefix + state.nextId++;
  const rosterPiece = (state, type, progress = {}) => Growth.ensure({ id: nextID(state, 'r'), type, level:progress.level, exp:progress.exp });
  const unit = (state, type, side, x, y, rosterId = null, progress = {}) => {
    const piece = Growth.ensure({ id: nextID(state, 'u'), type, side, currentSide: side, location: 'board', x, y, level:progress.level, exp:progress.exp });
    piece.hp = piece.maxHp = Growth.stats(piece).hp;
    // Battle-start provenance never changes when this individual changes sides.
    Object.defineProperties(piece, {
      originSide: { value: side, enumerable: true },
      rosterId: { value: rosterId, enumerable: true }
    });
    return piece;
  };
  const handFor = (state, side) => state.hands?.[side] || [];
  const allBattleUnits = state => [...state.units, ...handFor(state, 'player'), ...handFor(state, 'enemy')];

  function formationError(state, ids) {
    if (!Array.isArray(ids) || ids.length > ARMY_RULES.maxHandPieces) return `手駒は最大${ARMY_RULES.maxHandPieces}体まで編成できるよ。`;
    if (new Set(ids).size !== ids.length) return '同じ個体は2回選べないよ。';
    const pieces = ids.map(id => state.roster.find(piece => piece.id === id));
    if (pieces.some(piece => !piece || !MASTER[piece.type] || piece.type === 'king')) return '持っている手駒を選んでね。';
    if (pieces.reduce((sum, piece) => sum + MASTER[piece.type].cost, 0) > ARMY_RULES.costLimit) return `編成コストは${ARMY_RULES.costLimit}までだよ。`;
    return null;
  }

  function weightedEnemy(floor) {
    // No level scaling: deeper floors change the encounter pool, not master values.
    const depth = (floor - 2) / 8;
    const entries = [
      ['slime', 30 - depth * 25], ['goblin', 25 - depth * 9],
      ['hamster', 16 - depth * 9], ['archer', 12 + depth * 3],
      ['knight', 8 + depth * 12], ['orc', 5 + depth * 15],
      ['mage', 2 + depth * 15], ['golem', 2 + depth * 13],
      ['dragon', floor < 4 ? 0 : 0.6 + depth * 3.4]
    ];
    let roll = Math.random() * entries.reduce((sum, entry) => sum + entry[1], 0);
    for (const [type, weight] of entries) { roll -= weight; if (roll < 0) return type; }
    return 'goblin';
  }

  function startBattle(state) {
    const error = formationError(state, state.formation);
    if (error) return { ok: false, error, events: [] };
    state.hands = { player: [], enemy: [] };
    state.battleFinalized = false;
    state.lastRewardDetails = [];
    state.lastReturns = [];
    state.defeatedForEXP = []; state.damageContributors = {}; state.lastCrystalReward = 0;
    state.units = [unit(state, 'king', 'player', 0, 2, state.kingId || null, state.king || {})];
    state.formation.forEach((id, index) => {
      const piece = state.roster.find(item => item.id === id);
      const {x,y} = ARMY_RULES.playerSlots[index];
      state.units.push(unit(state, piece.type, 'player', x, y, piece.id, piece));
    });
    const enemyProgress = { level: Math.floor((state.floor - 1) / 3) + 1, exp: 0 };
    state.units.push(unit(state, 'king', 'enemy', 6, 2, null, enemyProgress));
    const enemies = state.floor === 1 ? ARMY_RULES.firstFloorEnemyTypes : Array.from({ length: ARMY_RULES.maxHandPieces }, () => weightedEnemy(state.floor));
    enemies.forEach((type, index) => {
      const {x,y} = ARMY_RULES.enemySlots[index];
      state.units.push(unit(state, type, 'enemy', x, y, null, enemyProgress));
    });
    state.phase = 'player';
    state.turn = 1;
    state.candidates = [];
    state.lastRewards = [];
    state.history = {};
    append(state, `${state.floor}Fの戦闘開始。味方は全員HP全回復。`);
    return { ok: true, events: [{ type: 'start', floor: state.floor }] };
  }

  function createCollection() {
    const ids = { nextId: 1 };
    const king = rosterPiece(ids, 'king');
    const roster = ARMY_RULES.startingTypes.map(type => rosterPiece(ids, type));
    return { king, roster, formation: roster.map(piece => piece.id), nextId: ids.nextId, crystals: 0 };
  }

  function createRun(collection = createCollection(), preparation = false) {
    const state = {
      floor: 1, turn: 1, totalActions: 0, phase: 'player', units: [],
      roster: [], formation: [], candidates: [], lastRewards: [], log: [],
      history: {}, nextId: collection.nextId, kingId: collection.king.id,
      hands: { player: [], enemy: [] }, battleFinalized: false,
      lastRewardDetails: [], lastReturns: [], king: Growth.ensure({ ...collection.king }),
      crystals: collection.crystals || 0, defeatedForEXP: [], damageContributors: {}, lastCrystalReward: 0
    };
    state.roster = collection.roster.map(piece => Growth.ensure({ ...piece }));
    state.formation = collection.formation.slice();
    if (preparation) state.phase = 'preparation';
    else startBattle(state);
    return state;
  }

  function restoreRun(snapshot) {
    const state = JSON.parse(JSON.stringify(snapshot));
    for (const piece of allBattleUnits(state)) Object.defineProperties(piece, {
      originSide: { value: piece.originSide, enumerable: true, writable: false, configurable: false },
      rosterId: { value: piece.rosterId, enumerable: true, writable: false, configurable: false }
    });
    return state;
  }

  function begin(state) {
    if (state.phase !== 'preparation') return { ok: false, error: '探索前の編成画面から出撃してね。', events: [] };
    return startBattle(state);
  }

  function moves(state, unitId) {
    const actor = find(state, unitId);
    if (!actor || actor.hp <= 0) return [];
    const max = MASTER[actor.type].move;
    const occupied = new Set(state.units.filter(piece => piece.id !== actor.id && piece.hp > 0).map(piece => `${piece.x},${piece.y}`));
    const visited = new Set([`${actor.x},${actor.y}`]);
    const queue = [{ x: actor.x, y: actor.y, path: [] }];
    const result = [];
    for (let index = 0; index < queue.length; index++) {
      const current = queue[index];
      if (current.path.length >= max) continue;
      for (const [dx, dy] of [[1, 0], [0, 1], [0, -1], [-1, 0]]) {
        const x = current.x + dx, y = current.y + dy, key = `${x},${y}`;
        if (!inside(x, y) || occupied.has(key) || visited.has(key)) continue;
        visited.add(key);
        const move = { x, y, path: current.path.concat([{ x, y }]) };
        queue.push(move);
        result.push(move);
      }
    }
    return result;
  }

  function targets(state, unitId) {
    const actor = find(state, unitId);
    if (!actor || actor.hp <= 0) return [];
    return state.units.filter(target => target.hp > 0 && target.side !== actor.side && distance(actor, target) <= MASTER[actor.type].range);
  }

  const compareIds = (a, b) => a < b ? -1 : a > b ? 1 : 0;
  const byId = (a, b) => compareIds(a.id, b.id);
  const hasPassive = (piece, passiveId) => (PASSIVE_LOADOUTS[piece.type] || []).includes(passiveId);

  function passivesFor(type) {
    return (PASSIVE_LOADOUTS[type] || []).map(id => PASSIVES[id]);
  }

  function guardsFor(state, target) {
    return state.units.filter(piece => piece.hp > 0 && piece.side === target.side
      && hasPassive(piece, 'stoneWall') && distance(piece, target) === 1)
      .sort((a, b) => b.hp - a.hp || byId(a, b));
  }

  function combatInfo(state, unitId) {
    const actor = find(state, unitId);
    if (!actor || actor.hp <= 0) return null;
    const knights = state.units.filter(piece => piece.hp > 0 && piece.side === actor.side
      && hasPassive(piece, 'inspiration') && distance(piece, actor) === 1).sort(byId);
    const baseAtk = Growth.stats(actor).atk;
    const atk = Math.floor(baseAtk * (1 + knights.length * PASSIVES.inspiration.bonusMultiplier));
    const guards = guardsFor(state, actor);
    return {
      baseAtk, atk, bonusAtk: atk - baseAtk, knightIds: knights.map(piece => piece.id),
      passives: passivesFor(actor.type), guardId: guards[0]?.id || null, guardIds: guards.map(piece => piece.id)
    };
  }

  function rewardPreview(state) {
    return allBattleUnits(state).filter(piece => piece.type !== 'king' && piece.originSide === 'enemy'
      && piece.currentSide === 'player').sort(byId).map(piece => ({
        unitId: piece.id, type: piece.type, currentSide: piece.currentSide,
        originSide: piece.originSide, location: piece.location, rosterId: piece.rosterId
      }));
  }

  function refreshProspects(state) {
    // Compatibility snapshot only: no accumulated kill/drop list remains.
    state.candidates = active(state) ? rewardPreview(state).map(piece => piece.type) : [];
  }

  function finalizeBattle(state, events) {
    if (state.battleFinalized) return;
    state.battleFinalized = true;
    const won = state.phase === 'victory' || state.phase === 'clear';
    const rewards = won ? rewardPreview(state) : [];
    const originals = allBattleUnits(state).filter(piece => piece.type !== 'king'
      && piece.originSide === 'player' && piece.rosterId != null).sort(byId);
    state.lastReturns = originals.map(piece => ({
      unitId: piece.id, type: piece.type, rosterId: piece.rosterId,
      fromSide: piece.currentSide, fromLocation: piece.location
    }));
    for (const piece of originals) {
      if (piece.currentSide !== 'player') {
        state.units = state.units.filter(other => other.id !== piece.id);
        for (const side of ['player', 'enemy']) state.hands[side] = handFor(state, side).filter(other => other.id !== piece.id);
        piece.side = 'player'; piece.currentSide = 'player'; piece.location = 'hand'; piece.x = null; piece.y = null;
        state.hands.player.push(piece);
      }
    }
    for (const returned of state.lastReturns) events.push({ type: 'return', unitId: returned.unitId,
      unitType: returned.type, rosterId: returned.rosterId, side: 'player',
      fromSide: returned.fromSide, fromLocation: returned.fromLocation });
    if (originals.length) append(state, `元の所有手駒${originals.length}体を、元の個体IDで返還。`);
    state.lastRewardDetails = [];
    state.lastRewards = rewards.map(piece => piece.type);
    for (const captured of rewards) {
      const progress = allBattleUnits(state).find(piece => piece.id === captured.unitId);
      const owned = rosterPiece(state, captured.type, progress);
      state.roster.push(owned);
      state.lastRewardDetails.push({ unitId: captured.unitId, type: captured.type, rosterId: owned.id });
    }
    state.candidates = [];
    if (won) {
      state.lastCrystalReward = state.floor * 100;
      state.crystals = (state.crystals || 0) + state.lastCrystalReward;
      append(state, `経験の結晶 ${state.lastCrystalReward} EXPを獲得。`);
      append(state, state.phase === 'clear' ? `10F踏破！ 試作版クリア！ 手駒${rewards.length}体を正式獲得。`
        : `${state.floor}Fクリア！ 手駒${rewards.length}体を正式獲得。`);
      events.push({ type: state.phase, rewards: state.lastRewards.slice(),
        acquired: state.lastRewardDetails.map(piece => ({ ...piece })), returned: state.lastReturns.map(piece => ({ ...piece })) });
    } else {
      append(state, '味方の王が倒れた。今回の敵出自の手駒は正式獲得しない。');
      events.push({ type: 'defeat', rewards: [], acquired: [], returned: state.lastReturns.map(piece => ({ ...piece })) });
    }
  }

  function updateOwnedGrowth(state, piece) {
    if (piece.originSide !== 'player') return;
    const owned = piece.type === 'king' ? state.king : state.roster.find(p => p.id === piece.rosterId);
    if (owned) { owned.level = Growth.level(piece); owned.exp = piece.exp || 0; }
  }

  function awardDefeatEXP(state, target, killer, events) {
    state.defeatedForEXP ||= [];
    if (state.defeatedForEXP.includes(target.id)) return;
    state.defeatedForEXP.push(target.id);
    const participants = new Set(state.damageContributors?.[target.id] || []);
    participants.add(killer.id);
    const base = Growth.level(target) * 50;
    for (const piece of allBattleUnits(state).filter(p => p.side === killer.side && participants.has(p.id)).sort(byId)) {
      const amount = piece.id === killer.id ? base : base / 2;
      const change = Growth.addEXP(piece, amount);
      updateOwnedGrowth(state, piece);
      if (change.to > change.from) {
        append(state, `${piece.side === 'player' ? '味方' : '敵'}の${MASTER[piece.type].name} Lv.${change.from} → Lv.${change.to}！`);
        events.push({ type:'levelUp', unitId:piece.id, from:change.from, to:change.to });
      }
    }
  }

  function train(state, ownedId, amount) {
    if (!['preparation','victory','defeat','clear'].includes(state.phase)) return { ok:false, error:'育成は探索外・階層間で行えるよ。' };
    const piece = ownedId === state.kingId ? state.king : state.roster.find(p => p.id === ownedId);
    if (!piece || !Number.isSafeInteger(amount) || amount <= 0 || amount > (state.crystals || 0)) return { ok:false, error:'結晶残高以内の整数を入力してね。' };
    const change = Growth.addEXP(piece, amount);
    state.crystals -= amount;
    for (const current of allBattleUnits(state).filter(p => p.originSide === 'player' && p.rosterId === ownedId)) {
      const oldMax = current.maxHp; current.level = piece.level; current.exp = piece.exp;
      current.maxHp = Growth.stats(current).hp;
      if (current.hp > 0) current.hp += current.maxHp - oldMax;
    }
    return { ok:true, ...change };
  }

  function defeated(state, target, events, captorSide) {
    const from = { x: target.x, y: target.y }, fromSide = target.side;
    events.push({ type: 'death', unitId: target.id, unitType: target.type, side: fromSide });
    state.units = state.units.filter(piece => piece.id !== target.id);
    append(state, `${fromSide === 'player' ? '味方' : '敵'}の${MASTER[target.type].name}を撃破。`);
    if (target.type !== 'king') {
      state.hands ||= { player: [], enemy: [] };
      state.hands[captorSide] ||= [];
      target.side = captorSide; target.currentSide = captorSide; target.location = 'hand'; target.x = null; target.y = null;
      state.hands[captorSide].push(target);

      || c.formation.reduce((n,id) => n + MASTER[c.roster.find(p => p.id === id).type].cost,0) > ARMY_RULES.costLimit) throw Error('Invalid ownership');

      || pieces.some(p => !MASTER[p.type] || !['player','enemy'].includes(p.originSide) || p.currentSide !== p.side)

function sync(collection, state) {
  // Ownership never disappears when an individual changes side in battle.
  const owned = new Map(collection.roster.map(p => [p.id, { ...p }]));
  for (const piece of state.roster) owned.set(piece.id, { ...Growth.ensure(piece) });
  collection.roster = [...owned.values()];
  collection.king = { ...Growth.ensure(state.king || collection.king) };
  collection.crystals = state.crystals || 0;
  state.roster = collection.roster.map(p => ({ ...p }));
  collection.formation = state.formation.slice();

  state.nextId = collection.nextId;
}

    return true;
  } catch (_) { return false; }
}

function clear() {
  try { localStorage.removeItem(KEY); readError = false; return true; }
  catch (_) { return false; }
}

})();

function unitTap(id) {
  if (busy || overlay.hidden===false || state.phase!=='player') return;
  const actor=selected(), target=find(id);
  if (!target) return;
  if (actor && actor.side==='player' && target.side==='enemy' && Engine.targets(state,actor.id).some(t=>t.id===id)) {
    doAction({type:'attack',unitId:actor.id,targetId:id});return;
  }
  selectedHandId=null;attackMode=false;selectedId=selectedId===id?null:id;render();
}
function cellTap(x,y) {
  if(busy||!overlay.hidden||state.phase!=='player')return;
  const occupied=state.units.find(u=>u.x===x&&u.y===y);
  const hand=selectedHand();
  if(hand&&hand.side==='player') {
    if(!occupied&&deploySquares().some(p=>p.x===x&&p.y===y))doAction({type:'deploy',unitId:hand.id,x,y});
    else toast('出撃できる空きマスを選んでね。');
    return;
  }
  if(occupied){unitTap(occupied.id);return;}
  const actor=selected();
  if(actor&&actor.side==='player') {
    if(Engine.moves(state,actor.id).some(m=>m.x===x&&m.y===y)) doAction({type:'move',unitId:actor.id,x,y});

function canAnimate(context) {

async function playVisual(element, frames, options, context) {
  if(!element?.isConnected||!canAnimate(context))return false;
  const animation=element.animate(frames,options);
  activeAnimations.add(animation);
  try {
    await animation.finished;
    return canAnimate(context)&&element.isConnected;
  } catch(error) {
    // Layout changes cancel WAAPI promises. Continue later nonvisual events exactly once.
    if(error.name!=='AbortError')console.error(error);
    return false;
  } finally {

}
async function animateEvents(events, context) {

      toast(`${e.side==='player'?'捕獲！':'敵が捕獲！'} ${MASTER[e.unitType].icon} ${MASTER[e.unitType].name}（戦闘中の手駒）`);

    }

    if(e.type==='deploy') {

      const guardian=unitElements.get(e.unitId),point=context.positions.get(e.unitId);

      board.dataset.animation='guard';

      cue.dataset.sourceId=e.unitId;cue.dataset.effect='guard';

        await playVisual(guardian.querySelector('.token'),[{filter:'brightness(1)'},{filter:'brightness(1.8) drop-shadow(0 0 8px #cce5c0)'},{filter:'brightness(1)'}],{duration:reducedMotion?1:context.guardDuration},context);
      } finally {cue.remove();}
    }
    if(e.type==='move') {
      const el=unitElements.get(e.unitId);if(!el)continue;
      board.dataset.animation='move';
      const complete=await playVisual(el,[e.from,...e.path].map(point=>displayPosition(point)),{duration:reducedMotion?1:Math.max(240,e.path.length*145),easing:'ease-in-out',fill:'forwards'},context);
      // A canceled old projection must never overwrite the reconciled position.
      if(complete)placeUnit(el,e.to);
    }
    if(e.type==='attack') {

      if(!attacker||!target)continue;
      board.dataset.animation=e.followUp?'support':'attack';
      const actorPoint=context.positions.get(e.unitId),targetPoint=context.positions.get(e.targetId);

      } finally {cue?.remove();}
      if(!complete||!target.isConnected)continue;

      damage.dataset.recipientId=e.targetId;damage.dataset.originalTargetId=e.originalTargetId||e.targetId;
      Object.assign(damage.style,displayPosition(targetPoint,.5,.35));pieceLayer.appendChild(damage);

function showPassiveCue(text,point) {
  const cue=document.createElement('span');cue.className='passive-cue';cue.textContent=text;
  Object.assign(cue.style,displayPosition(point,.5,.25));pieceLayer.appendChild(cue);return cue;

async function doAction(action) {
  if(busy||!['player','enemy'].includes(state.phase))return;
  const token=generation;
  const context={generation:token,revision:projectionRevision,skipVisual:false,positions:new Map(state.units.map(u=>[u.id,{x:u.x,y:u.y}])),maxHp:new Map(state.units.map(u=>[u.id,u.maxHp]))};
  const result=Engine.act(state,action);
  if(!result.ok){toast(result.error);return;}
  saveState(); // Save the committed action and settlement before any animation or enemy timer.
  // Bound added presentation time as more passives fire; combat still resolves in the engine once.
  context.supportDuration=Math.max(28,Math.min(95,450/Math.max(1,result.events.filter(e=>e.type==='attack'&&e.followUp).length)));
  context.guardDuration=Math.max(25,Math.min(90,220/Math.max(1,result.events.filter(e=>e.type==='guard').length)));
  context.deathDuration=Math.max(45,Math.min(230,460/Math.max(1,result.events.filter(e=>e.type==='death').length)));
  presentationContext=context;attackMode=false;busy=true;render(true);
  try {await animateEvents(result.events,context);} catch(error) {console.error(error);}
  finally {if(presentationContext===context)presentationContext=null;delete board.dataset.animation;}
  if(token!==generation)return;
  busy=false;selectedId=null;selectedHandId=null;render();
  if(['victory','defeat','clear'].includes(state.phase)) {await sleep(reducedMotion?1:300);showResult();}
  else if(state.phase==='enemy') scheduleEnemy();
}
async function scheduleEnemy() {
  const token=generation;
  await sleep(reducedMotion?30:620);
  if(token===generation&&state.phase==='enemy'&&!busy)await doAction(Engine.chooseAI(state));
}
$('normalAttackBtn').addEventListener('click',()=>{
  const u=selected();
  if(busy||!overlay.hidden||state.phase!=='player'||u?.side!=='player'||!Engine.targets(state,u.id).length)return;
  attackMode=true;render();
});
$('cancelAttackBtn').addEventListener('click',()=>{attackMode=false;render();});
for(const name of ['menu','log']) {
  $(name+'Btn').addEventListener('click',()=>toggleFlyout(name));
  $('close'+(name==='menu'?'Menu':'Log')+'Btn').addEventListener('click',()=>{
    closeFlyouts();$(name+'Btn').focus();
  });
}
document.addEventListener('click',event=>{
  if(!event.target.closest('.flyout,#menuBtn,#logBtn'))closeFlyouts();
});
$('waitBtn').addEventListener('click',()=>{
  if(busy||state.phase!=='player'||!overlay.hidden)return;
  const u=find(selectedId);doAction({type:'wait',...(u?.side==='player'?{unitId:u.id}:{})});
});
function rewardsHTML() {
  return state.lastRewards.length?state.lastRewards.map(type=>`<span class="loot-chip">${MASTER[type].icon} ${MASTER[type].name} × 1</span>`).join(''):'<p>今回は正式獲得なし。元の所有手駒は返還されたよ。</p>';
}
function showFormation() {
  const preparing=state.phase==='preparation';
  const cost=state.formation.reduce((sum,id)=>sum+MASTER[state.roster.find(p=>p.id===id).type].cost,0);
  const rosterCards=state.roster.map((p,i)=>{
    const m={...MASTER[p.type],...Growth.stats(p)},chosen=state.formation.includes(p.id);
    const isNew=i>=state.roster.length-state.lastRewards.length;
    return `<button class="roster-card ${chosen?'chosen':''}" data-roster="${p.id}" aria-pressed="${chosen}" aria-label="${m.name} 個体${i+1} コスト${m.cost} ${chosen?'出撃中':'控え'}"><span class="roster-icon" aria-hidden="true">${m.icon}</span><span class="cost">COST ${m.cost}</span><span class="check">${chosen?'✓ 出撃':isNew?'NEW':''}</span><span class="name">${m.name} <small style="color:var(--muted)">#${i+1}</small></span><span class="mini-stat">Lv.${Growth.level(p)} · ${Growth.rank(p)} · EXP ${p.exp||0}/${Growth.required(p)}<br>HP ${m.hp}　ATK ${m.atk}<br>移動 ${m.move}　射程 ${m.range}</span></button>`;
  }).join('');
  openModal('formation',`<div class="modal-title"><div><div class="eyebrow">${preparing?'EXPEDITION PREPARATION':`FLOOR ${String(state.floor).padStart(2,'0')} — VICTORY`}</div><h2 id="modalTitle">${preparing?'所有駒を選んで、世界の底へ。':'手駒を迎えて、さらに深く。'}</h2><p>${preparing?`所有 ${state.roster.length+1}体（王を含む） · ${saveWarningShown?'自動保存できていないため、ブラウザーの保存設定を確認してね。':'この端末に自動保存。'}<br>王は必須。手駒を選んで探索を始めよう。`:`正式獲得 ${state.lastRewards.length}体 · 元の所有手駒 ${state.lastReturns?.length||0}体を返還。<br>味方は全員復帰・HP全回復。次の仲間を選ぼう。`}</p></div><span style="color:var(--gold);font-size:27px">✦</span></div><div class="rewards" aria-label="獲得した手駒">${preparing?'':rewardsHTML()}</div><div class="divider"></div><div class="formation-bar"><span>結晶 <b id="crystalBalance">${state.crystals||0}</b> EXP · 次の出撃メンバー <small>タップで入れ替え</small></span><span class="formation-count">手駒 ${state.formation.length}/${ARMY_RULES.maxHandPieces}　コスト ${cost}/${ARMY_RULES.costLimit}</span></div><div class="roster"><div class="roster-card fixed"><span class="roster-icon">${MASTER.king.icon}</span><span class="cost">COST 0</span><span class="check" style="color:var(--gold)">必須</span><span class="name">王 <small>#${state.kingId}</small></span><span class="mini-stat">Lv.${Growth.level(state.king)} · F · EXP ${state.king.exp||0}/${Growth.required(state.king)}<br>HP ${Growth.stats(state.king).hp}　ATK ${Growth.stats(state.king).atk}<br>移動 1　射程 1</span></div>${rosterCards}</div><div class="modal-actions"><span class="modal-note">同じ種類も編成OK。選んだ${ARMY_RULES.maxHandPieces}体までが王と出撃するよ。</span><button id="trainBtn">経験の結晶で育成</button><button class="primary" id="nextFloorBtn">${preparing?'探索開始 →':`${state.floor+1}Fへ進む →`}</button></div>`);
  modal.querySelectorAll('[data-roster]').forEach(button=>button.addEventListener('click',()=>{
    const id=button.dataset.roster;
    const ids=state.formation.includes(id)?state.formation.filter(p=>p!==id):[...state.formation,id];
    const result=Engine.setFormation(state,ids);
    if(!result.ok){toast(result.error);return;}
    saveState();showFormation();modal.querySelector(`[data-roster="${id}"]`)?.focus();
  }));
  $('trainBtn').addEventListener('click',showTraining);
  $('nextFloorBtn').addEventListener('click',()=>{
    const result=preparing?Engine.begin(state):Engine.advance(state);if(!result.ok){toast(result.error);return;}
    saveState();
    attackMode=false;selectedId=null;selectedHandId=null;closeModal();render();toast(`${state.floor}Fへ。軍団のHPが全回復した！`);
  });
}
function showTraining() {
  if(!['preparation','victory','defeat','clear'].includes(state.phase))return;
  const owned=[state.king,...state.roster],balance=state.crystals||0;
  openModal('training',`<div class="eyebrow">GROW YOUR COMPANION</div><h2 id="modalTitle">経験の結晶で育てる</h2><p>結晶残高 <b id="trainingBalance">${balance}</b> EXP · 1結晶＝1EXP</p><div class="training-fields"><label>育てる個体<select id="trainingPieceSelect" aria-label="育てる個体"></select></label><label>投入EXP<input id="trainingAmount" aria-label="投入EXP" type="number" inputmode="numeric" min="1" step="1" max="${balance}" value="${Math.min(100,balance)}"></label><button id="trainingMaxBtn" ${balance?'':'disabled'}>MAX</button></div><p id="trainingPreview" aria-live="polite"></p><div class="modal-actions"><button id="backToFormationBtn">編成へ戻る</button><button id="confirmTrainingBtn" class="primary" ${balance?'':'disabled'}>結晶を投入</button></div>`);
  for(const piece of owned) {
    const option=document.createElement('option');option.value=piece.id;
    option.textContent=`${MASTER[piece.type].icon} ${MASTER[piece.type].name} #${piece.id} · Lv.${Growth.level(piece)} · ${Growth.rank(piece)} · EXP ${piece.exp||0}/${Growth.required(piece)}`;
    $('trainingPieceSelect').appendChild(option);
  }
  function preview() {
    const piece=owned.find(p=>p.id===$('trainingPieceSelect').value),amount=Number($('trainingAmount').value);
    const valid=Number.isSafeInteger(amount)&&amount>0&&amount<=balance;
    $('confirmTrainingBtn').disabled=!valid;
    const future={...piece};if(valid)Growth.addEXP(future,amount);
    $('trainingPreview').textContent=`Lv.${Growth.level(piece)} → Lv.${Growth.level(future)} · HP ${Growth.stats(piece).hp} → ${Growth.stats(future).hp} · ATK ${Growth.stats(piece).atk} → ${Growth.stats(future).atk} · 成長後EXP ${future.exp||0}/${Growth.required(future)}`;
  }
  $('trainingPieceSelect').addEventListener('change',preview);$('trainingAmount').addEventListener('input',preview);
  $('trainingMaxBtn').addEventListener('click',()=>{$('trainingAmount').value=balance;preview();});
  $('backToFormationBtn').addEventListener('click',showFormation);
  $('confirmTrainingBtn').addEventListener('click',()=>{
    const result=Engine.train(state,$('trainingPieceSelect').value,Number($('trainingAmount').value));
    if(!result.ok){toast(result.error);return;}
    const id=$('trainingPieceSelect').value;saveState();showTraining();$('trainingPieceSelect').value=id;preview();
  });
  preview();
}
function showResult() {
  if(state.phase==='victory') {showFormation();return;}
  if(!['clear','defeat'].includes(state.phase))return;
  const won=state.phase==='clear';
  openModal('ending',`<div class="ending"><div class="eyebrow">${won?'PROTOTYPE COMPLETED':'THE JOURNEY ENDS'}</div><div class="emblem">${won?'♛':'♚'}</div><h2 id="modalTitle">${won?'世界の底へ、最初の一歩。':'王は倒れた。でも、また潜れる。'}</h2><p>${won?'10F踏破！ セカソコ！～手駒編～ VER.011 クリア。':'味方の王のHPが0になった。新しい所有手駒の獲得はなし。元の所有手駒は返還された。'}<br>${state.floor}F到達 · 総行動 ${state.totalActions}手 · 所有駒${state.roster.length+1}体（王を含む）。<br>正式獲得 ${state.lastRewards.length}体 · 元の所有手駒 ${state.lastReturns?.length||0}体を返還。</p>${won?`<div class="rewards" style="justify-content:center">${rewardsHTML()}</div>`:''}<div class="modal-actions"><button class="primary" id="retryBtn">所有駒で編成し直す →</button></div><p style="font-size:10px;margin-top:15px">正式に獲得した所有駒を保持して、1Fから新しく探索するよ。</p></div>`);
  $('retryBtn').addEventListener('click',resetRun);
}
function resetRun() {
  saveState();generation++;busy=false;attackMode=false;selectedId=null;selectedHandId=null;state=Engine.createRun(collection,true);
  for(const el of unitElements.values())el.remove();unitElements.clear();
  board.querySelectorAll('.floating-damage,.passive-cue').forEach(el=>el.remove());
  saveState();closeModal();render();showFormation();
}
function showPieceDetails() {
  const u=selected();if(!u||busy||state.phase!=='player'||!overlay.hidden)return;
  const m=MASTER[u.type],inHand=!!selectedHand();
  const info=inHand?{atk:Growth.stats(u).atk,bonusAtk:0,knightIds:[],guardId:null}:Engine.combatInfo(state,u.id);
  const guard=info.guardId?find(info.guardId):null;
  const passives=Engine.passivesFor(u.type).map(p=>`<div class="passive-description"><b>${p.name}</b><p>${p.description}</p></div>`).join('')||'<p>パッシブなし</p>';
  const canAttack=!inHand&&u.side==='player'&&Engine.targets(state,u.id).length>0;
  openModal('piece',`<div class="piece-detail"><div class="modal-title"><div><div class="eyebrow">${u.side==='player'?'味方':'敵'}${inHand?'の捕獲手駒':'の盤上駒'}</div><h2 id="modalTitle">${m.icon} ${m.name}</h2><p class="detail-id">個体 #${u.id} · ${u.originSide==='player'?'元の所有手駒':'今回の敵出自'}</p></div><button class="icon-btn" id="closeDetailsBtn" aria-label="駒の詳細を閉じる">×</button></div><p class="growth-detail">Lv.${Growth.level(u)} · ランク ${Growth.rank(u)} · EXP ${u.exp||0} / ${Growth.required(u)}</p><div class="detail-stats"><span>${inHand?'出撃時 ':''}HP<b>${inHand?u.maxHp:u.hp} / ${u.maxHp}</b></span><span>ATK<b class="detail-effective-atk">${info.atk}</b><small>Lv ATK ${Growth.stats(u).atk} ＋ ${info.bonusAtk}</small></span><span>移動<b>${m.move}</b></span><span>射程<b>${m.range}</b></span><span>編成コスト<b>${m.cost}</b></span></div><div class="protection-info">${inHand?'再出撃は満HP・コストなし。手駒内のパッシブは発動せず、出撃直後から有効。':guard?`守護の石壁：${MASTER[guard.type].name} #${guard.id} が肩代わり（HP ${guard.hp} / ${guard.maxHp}）`:'守護の石壁：保護なし'}</div><div class="passive-info">${info.knightIds.length?`<p>鼓舞：隣接する騎士${info.knightIds.length}体で強化中。</p>`:''}${passives}</div>${inHand?'<p>味方の手駒を選んで、光る空きマスへ出撃。敵陣も選べる。戦闘中の人数上限はない。</p>':''}<div class="modal-actions"><button id="detailAttackBtn" ${canAttack?'':'disabled'}>通常攻撃</button><button disabled>固有技（未実装）</button><button disabled>必殺技（未実装）</button><button class="primary" id="backFromDetailsBtn">盤面へ戻る</button></div></div>`);
  $('closeDetailsBtn').addEventListener('click',closeModal);$('backFromDetailsBtn').addEventListener('click',closeModal);
  $('detailAttackBtn').addEventListener('click',()=>{closeModal();$('normalAttackBtn').click();});
}
$('detailsBtn').addEventListener('click',showPieceDetails);
function showRules() {
  const passiveRules=Object.keys(MASTER).flatMap(type=>Engine.passivesFor(type).map(p=>`${MASTER[type].name}「${p.name}」：${p.description}`)).join("<br>");
  openModal('rules',`<div class="modal-title"><div><div class="eyebrow">HOW TO PLAY · VER.011</div><h2 id="modalTitle">一手ずつ、仲間と底へ。</h2></div><button class="icon-btn" id="closeRulesBtn" aria-label="遊び方を閉じる">×</button></div><div class="rules-grid"><section><h3>01 · 動く、攻める、待つ。</h3><p>味方の駒 → 青いマスで移動。<br>味方の駒 → 赤い敵で攻撃。<br>移動と攻撃はそれぞれ1行動。1体の行動後、敵と交代するよ。待機は未選択でも使える。範囲は上下左右の距離、移動は駒を通り抜けられない。遠距離攻撃は射線を遮られないよ。</p></section><section><h3>02 · 王を守って、手駒を集める。</h3><p>敵の王を倒せば勝利、味方の王が倒れたら敗北。王手・詰みはなし。<br>王以外を撃破すると、その個体が戦闘中の捕獲手駒に。敵も捕獲・再出撃するよ。<br>勝利時に「今回の敵出自で、いま味方に所属する個体」だけを100%正式獲得。敵に奪い返された個体は獲得しない。元の所有手駒は勝敗を問わず返還される。</p></section><section><h3>03 · 軍団を組んで、次の階層へ。</h3><p>王1体＋手駒最大${ARMY_RULES.maxHandPieces}体、コスト合計${ARMY_RULES.costLimit}以内。<br>同じ種類も複数編成OK。階層の間に全員が復帰し、HP全回復。捕獲手駒は同じ戦闘中にも再出撃できる。階層をまたぐ正式な編成とは別で、10Fを突破すれば試作版クリア！</p></section><section><h3>04 · 試作版について。</h3><p>数値と敵編成は仮仕様。2Fから敵はランダム、深層ほど強い敵に出会いやすくなるよ。<br>この端末に自動保存し、再起動すると続きから。所有駒は新しい探索にも引き継ぐ。探索外・階層間は経験の結晶で王も育成できる。LvでHP・ATKが上がり、撃破EXPは同じ戦闘・個体の初回のみ。音は未実装。iPhoneの縦向き・横向きで遊べるよ。</p></section><section><h3>05 · 仲間と連携する。</h3><p>${passiveRules}<br>自動発動で追加の手番は使わない。鼓舞は加算後に切り捨て。追撃からの追撃や、肩代わりの連鎖は起きないよ。王が倒れたらその時点で決着。ステータスの「詳細」から、強化や保護も確認しよう。</p></section><section><h3>06 · 捕獲して、再出撃。</h3><p>味方の捕獲手駒を選び、光る空きマスへ。全35マスが対象で、敵陣や敵王の隣もOK。<br>再出撃だけで1行動、満HP・コストなし。戦闘中は空きマスがある限り出撃できる。出撃直後からパッシブが有効で、手駒内では発動しない。再捕獲でも同じ個体のまま。横スクロールで全個体を選べるよ。</p></section></div><div class="divider"></div><div class="panel-head">CHARACTER MASTER · 全10種類</div><table class="master-table"><thead><tr><th>手駒</th><th>HP</th><th>ATK</th><th>移動</th><th>射程</th><th>コスト</th></tr></thead><tbody>${Object.values(MASTER).map(m=>`<tr><td>${m.icon} ${m.name}</td><td>${m.hp}</td><td>${m.atk}</td><td>${m.move}</td><td>${m.range}</td><td>${m.cost}</td></tr>`).join('')}</tbody></table><div class="modal-actions"><button class="primary" id="backToBoardBtn">盤面に戻る →</button></div>`);
  $('closeRulesBtn').addEventListener('click',closeModal);$('backToBoardBtn').addEventListener('click',closeModal);
}
$('helpBtn').addEventListener('click',showRules);
$('restartBtn').addEventListener('click',()=>{
  if(busy||state.phase==='enemy')return;
  openModal('restart',`<div class="eyebrow">START A NEW JOURNEY</div><h2 id="modalTitle">1Fからやり直す？</h2><p>今の探索と未確定の捕獲手駒を終了し、1Fの出撃前へ戻るよ。正式に所有した駒は残る。</p><div class="modal-actions"><button id="cancelRestartBtn" class="quiet">探索を続ける</button><button class="primary" id="confirmRestartBtn">最初から始める</button></div>`);
  $('cancelRestartBtn').addEventListener('click',closeModal);$('confirmRestartBtn').addEventListener('click',resetRun);
});
$('clearSaveBtn').addEventListener('click',()=>{
  if(busy||state.phase==='enemy')return;
  openModal('clearSave',`<div class="eyebrow">RESET ALL SAVE DATA</div><h2 id="modalTitle">全セーブデータを初期化する？</h2><p>永続所有・編成・探索の進行をすべて消すよ。初期所有の王・騎士・弓兵の3体に戻る。この操作は取り消せない。</p><div class="modal-actions"><button id="cancelClearSaveBtn" class="quiet">戻る</button><button class="primary" id="confirmClearSaveBtn">全データを初期化</button></div>`);
  $('cancelClearSaveBtn').addEventListener('click',closeModal);
  $('confirmClearSaveBtn').addEventListener('click',()=>{
    if(!Storage.clear()){toast('保存データを削除できなかった。ブラウザーの保存設定を確認してね。');return;}
    collection=Engine.createCollection();state=Engine.createRun(collection,true);saveWarningShown=false;
    generation++;busy=false;attackMode=false;selectedId=null;selectedHandId=null;
    for(const el of unitElements.values())el.remove();unitElements.clear();
    board.querySelectorAll('.floating-damage,.passive-cue').forEach(el=>el.remove());
    saveState();closeModal();render();showFormation();
  });
});
document.addEventListener('keydown',event=>{
  if(overlay.hidden) {
    if(event.key==='Escape') {
      if(!$('menuPanel').hidden||!$('logPanel').hidden) {
        const focus=$('menuPanel').hidden?'logBtn':'menuBtn';closeFlyouts();$(focus).focus();
      } else if(attackMode) {attackMode=false;render();}
      else if(selectedHandId){selectedHandId=null;render();}
    }
    return;
  }
  if(event.key==='Escape'&&['rules','restart','piece','clearSave'].includes(modalMode)) {closeModal();return;}
  if(event.key!=='Tab')return;
  const items=[...modal.querySelectorAll('button:not(:disabled),[tabindex="0"]')];
  if(!items.length){event.preventDefault();return;}
  const first=items[0],last=items[items.length-1];
  if(event.shiftKey&&(document.activeElement===first||document.activeElement===modal)){event.preventDefault();last.focus();}
  else if(!event.shiftKey&&(document.activeElement===last||document.activeElement===modal)){event.preventDefault();first.focus();}
});
paintProjection();render();saveState();
if(state.phase==='preparation')showFormation();
else if(['victory','defeat','clear'].includes(state.phase))showResult();
else if(state.phase==='enemy')scheduleEnemy();
// Read-only snapshot allows reproducible QA without affecting gameplay.
globalThis.Sekasoko.inspect = () => JSON.parse(JSON.stringify(state));
})();

</script>
</body>
</html>
